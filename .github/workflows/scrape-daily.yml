# goRiCycle — scrape automático gratuito (GitHub Actions free tier)
#
# Diário (incremental): actualiza preços das 5 lojas activas
# Domingo (full): re-scan completo do catálogo
#
# Requisitos no GitHub: Settings → Actions → General →
#   "Workflow permissions" → Read and write permissions

name: Scrape diário

on:
  schedule:
    # IMPORTANTE: GitHub Actions usa sempre UTC (não Lisboa/GMT).
    # 06:17 UTC ≈ 07:17 Lisboa (verão WEST) / 06:17 Lisboa (inverno WET).
    # Evitar :00/:30 — pico de carga; atrasos de horas ou skips são comuns (best-effort).
    # Backups às 09:17 e 12:17 UTC ignoram-se se o scrape do dia já correu.
    - cron: "17 6 * * 1-6"
    - cron: "17 9 * * 1-6"
    - cron: "17 12 * * 1-6"
    # Full semanal: domingo 03:17 UTC ≈ 04:17 Lisboa (verão)
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de scrape"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full

concurrency:
  group: scrape-daily
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Lojas activas no site (Back Market excluído — Cloudflare)
  SCRAPE_SOURCES: iservices,refurbed,swappie,certideal,callphone

jobs:
  should-run:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Skip se scrape agendado já correu hoje
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Trigger manual/push — a correr."
            exit 0
          fi

          TODAY=$(date -u +%Y-%m-%d)
          ALREADY=""
          if [ -f data/last_run_summary.json ]; then
            ALREADY=$(python3 -c "import json; print(json.load(open('data/last_run_summary.json')).get('run_at','')[:10])")
          fi

          if [ "$ALREADY" = "$TODAY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Scrape já actualizado hoje ($TODAY) — run de backup ignorado."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Último scrape: ${ALREADY:-nunca} — a correr (slot ${{ github.event.schedule }})."
          fi

  scrape:
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Determinar modo
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=incremental" >> "$GITHUB_OUTPUT"
          fi

      - name: Correr scrapers
        run: |
          python scrapers/run_all.py \
            --mode "${{ steps.mode.outputs.value }}" \
            --sources "$SCRAPE_SOURCES"

      - name: Validar e limpar dados pós-scrape
        run: |
          if [ "${{ steps.mode.outputs.value }}" = "full" ]; then
            python scrapers/validate_and_clean.py
          else
            python scrapers/validate_and_clean.py --no-live-check
          fi

      - name: Merge, correcções e deduplicação
        run: python scrapers/merge_and_clean.py

      - name: Curadoria de dados (Agente 1)
        run: python3 scripts/curator.py

      - name: Verificar sumário
        run: |
          python <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data/last_run_summary.json")
          if not path.exists():
              print("❌ last_run_summary.json em falta")
              sys.exit(1)

          summary = json.loads(path.read_text(encoding="utf-8"))
          total = summary.get("grand_total", 0)
          sources = summary.get("sources", {})

          print(f"Modo: {summary.get('mode')} | Total scrape: {total}")
          for name, stats in sources.items():
              errors = stats.get("errors", 0)
              count = stats.get("total", 0)
              flag = "⚠️" if errors or count == 0 else "✓"
              print(f"  {flag} {name}: {count} produtos, {errors} erros")
              if stats.get("fatal_error"):
                  print(f"      {stats['fatal_error'][:120]}")

          if total < 400:
              print(f"⚠️ grand_total ({total}) abaixo do esperado (~900+)")

          catalog_path = Path("data/all_products.json")
          if not catalog_path.exists():
              print("❌ all_products.json em falta após merge_and_clean")
              sys.exit(1)

          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          catalog_total = catalog.get("total_products", len(catalog.get("products", [])))
          print(f"Catálogo merge: {catalog_total} produtos únicos")
          if catalog_total < 400:
              print(f"⚠️ all_products ({catalog_total}) abaixo do esperado (~900+)")
          PY

      - name: Sync relatórios para Next.js (Vercel)
        run: |
          mkdir -p web/data
          for f in last_run_summary.json validate_and_clean_report.json; do
            if [ -f "data/$f" ]; then
              cp "data/$f" "web/data/$f"
            fi
          done

      - name: Commit dados actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Só adicionar ficheiros que existem. Um pathspec em falta
          # (ex.: scraper falhou após limpeza) faz o git add sair com código 128.
          stage_if_present() {
            for f in "$@"; do
              if [ -f "$f" ]; then
                git add -- "$f"
              else
                echo "⚠️ A ignorar (em falta): $f"
              fi
            done
          }

          stage_if_present \
            data/iservices_produtos.json \
            data/refurbed_produtos.json \
            data/swappie_produtos.json \
            data/certideal_produtos.json \
            data/callphone_produtos.json \
            data/all_products.json \
            data/last_run_summary.json \
            data/merge_and_clean_report.json \
            data/curation_report.json \
            web/data/iservices_produtos.json \
            web/data/refurbed_produtos.json \
            web/data/swappie_produtos.json \
            web/data/certideal_produtos.json \
            web/data/callphone_produtos.json \
            web/data/all_products.json \
            web/data/last_run_summary.json \
            web/data/merge_and_clean_report.json \
            data/validate_and_clean_report.json \
            web/data/validate_and_clean_report.json

          if git diff --staged --quiet; then
            echo "Sem alterações nos JSON — nada a commitar."
            exit 0
          fi

          git commit -m "chore(data): scrape automático $(date -u +%Y-%m-%d) (${{ steps.mode.outputs.value }})"

          # O scrape demora ~2h; entretanto podem entrar commits no main (ex.: código).
          # Rebase falha frequentemente — merge + retry é mais robusto.
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            if ! git merge "origin/${{ github.ref_name }}" --no-edit; then
              echo "⚠️ Conflito no merge (tentativa ${attempt}) — priorizar dados do scrape."
              git checkout --ours -- data/ web/data/ || true
              git add data/ web/data/
              git commit --no-edit || git commit -m "chore(data): scrape automático $(date -u +%Y-%m-%d) (${{ steps.mode.outputs.value }})"
            fi
            if git push origin "HEAD:${{ github.ref_name }}"; then
              pushed=1
              echo "✓ Dados publicados (tentativa ${attempt})."
              break
            fi
            sleep "$((attempt * 5))"
          done

          if [ "$pushed" -ne 1 ]; then
            echo "❌ Falha ao publicar dados após 5 tentativas."
            git status
            exit 1
          fi
